name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go test -v ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - run: docker compose --profile dev up --build -d

      - run: docker compose --profile dev run --rm dev ./test/integration_test.sh

      - if: always()
        run: docker compose --profile dev down

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, integration, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_CI_TAG }}

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="${{ env.IMAGE }}:${VERSION}"
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already exists, skipping"
          else
            docker buildx build --push \
              --tag "$TAG" \
              --tag "${{ env.IMAGE }}:latest" \
              --label "org.opencontainers.image.version=${VERSION}" \
              .
          fi
          echo "image_ref=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
          else
            IMAGE_REF="${{ steps.push.outputs.image_ref }}"
            NOTES=$(printf '## Container Image\n\n```\ndocker pull %s\n```' "$IMAGE_REF")
            gh release create "$VERSION" --generate-notes --notes "$NOTES"
          fi
